<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Space Invaders Game - A classic arcade shooter">
    <meta name="theme-color" content="#111111">
    
    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
  <title>Space Invader</title>
  <style>
 /* CSS Variables - Professional Setup */
:root {
  /* Colors */
  --color-primary: #111;
  --color-text: #C0C0C0;
  --color-white: #fff;
  --color-shadow: rgba(255, 255, 255, 0.7);
  
  /* UI Colors */
  --header-bg: rgba(15, 17, 25, 0.35);
  --ui-element-bg: rgba(0, 0, 0, 0.15);
  --header-border: rgba(255, 255, 255, 0.06);
  
  /* Dimensions */
  --game-width: 640px;
  --game-height: 640px;
  --header-height: 32px;
  --player-width: 54px;
  --player-height: 45px;
  
  /* Z-index layers */
  --z-effects: 1000;
  --z-header: 2000;
  --z-game: 2;
  --z-background: 1;
  
  /* Typography */
  --font-primary: 'Press Start 2P', cursive;
  --font-size-normal: 11px;
  --font-size-large: 16px;
  
  /* Effects */
  --glow-primary: rgba(255, 255, 255, 0.07);
  --glow-secondary: rgba(255, 255, 255, 0.03);
  --text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
  
  /* Transitions */
  --transition-standard: 0.3s;
}

/* Base Styles */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body { 
  margin: 0; 
  display: flex; 
  justify-content: center; 
  align-items: center; 
  height: 100vh; 
  background: var(--color-primary); 
  overflow: hidden;
  font-family: var(--font-primary);
  -webkit-font-smoothing: antialiased;
}

/* Effect Layers */
#noise-effect, 
#darkness-effect { 
  position: fixed; 
  top: 50%; 
  left: 50%; 
  width: var(--game-width); 
  height: var(--game-height); 
  transform: translate(-50%, -50%); 
  pointer-events: none; 
  z-index: var(--z-effects); 
}

#noise-effect { 
  background-image: url(''); 
  mix-blend-mode: darken; 
  opacity: 0.15; 
}

#darkness-effect { 
  background-image: url(''); 
  background-size: cover; 
}

/* Lobby Section */
#lobby { 
  position: relative; 
  width: var(--game-width); 
  height: var(--game-height); 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  justify-content: center; 
  background: linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0.3));
}

#lobby-background { 
  position: absolute; 
  top: 0; 
  left: 0; 
  width: 100%; 
  height: 100%; 
  background-image: url('assets/8IO7-UQAQNGwt5EcDbEr6g.webp'); 
  background-size: cover; 
  z-index: var(--z-background); 
  filter: brightness(0.9) contrast(1.1);
}

#lobby-logo { 
  margin-top: 50px; 
  width: 400px; 
  height: 135px; 
  margin-bottom: 5px; 
  z-index: var(--z-effects);
  transition: transform var(--transition-standard) ease;
  filter: drop-shadow(0 0 10px var(--glow-primary));
}

#lobby-logo:hover {
  transform: scale(1.02);
}

#lobby-text { 
  color: #fffae0f7; 
  font-family: var(--font-primary); 
  font-size: var(--font-size-large); 
  text-align: center; 
  text-shadow: 0px 2px 44px var(--color-shadow),
               0 0 10px rgba(255,255,255,0.2);
  margin-bottom: 20px; 
  z-index: var(--z-game); 
  animation: pulse 1.5s infinite;
}

#lobby-image { 
  margin-top: 40px; 
  z-index: var(--z-game); 
}

/* Game Section */
#game { 
  position: relative; 
  width: var(--game-width); 
  height: var(--game-height); 
  overflow: hidden; 
  display: none;
  background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 20%);
}

#background { 
  position: absolute; 
  top: 0; 
  left: 0; 
  width: var(--game-width); 
  height: var(--game-height); 
  background-image: url('assets/nI0XZsErTJmM2ambInGrxw.webp'); 
  background-size: cover;
  filter: contrast(1.1) brightness(0.95);
}

/* Game Elements */
#enemies-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: var(--z-background);
}

.enemy {
  position: absolute;
  transition: transform 0.016s linear;
  will-change: transform;
  filter: drop-shadow(0 0 3px rgba(255,0,0,0.2));
}

#player { 
    position: absolute; 
    width: 48px;
    height: 48px;
    background-image: url('assets/enemy-big.png'); 
    background-size: 200% 100%;
    background-repeat: no-repeat;
    will-change: transform, background-position;
    z-index: var(--z-game);
    filter: drop-shadow(0 0 5px var(--glow-primary));
    transform-origin: center center;
    image-rendering: pixelated;
    /* Remove the CSS animation */
}

@keyframes playerThrust {
    from { background-position: 0 0; }
    to { background-position: -96px 0; } /* Adjusted for new size */
}

/* Header and UI Elements */
.header { 
  z-index: var(--z-header); 
  position: absolute; 
  width: calc(var(--game-width) - 24px); 
  height: 30px; /* Fixed height */
  left: 13px; 
  top: 5px;
  display: flex; 
  justify-content: space-between; 
  align-items: center;
  background: linear-gradient(180deg, 
    rgba(20, 22, 30, 0.4) 0%, 
    rgba(15, 17, 25, 0.35) 100%);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  border-radius: 12px;
  padding: 0 15px;
  border: 1px solid var(--header-border);
}

.score { 
  display: flex; 
  gap: 6px; 
  align-items: center;
  background: var(--ui-element-bg);
  border-radius: 6px;
  padding: 0 8px;
}

.lives { 
  display: flex; 
  gap: 5px; 
  align-items: center;
  background: var(--ui-element-bg);
  border-radius: 6px;
  padding: 0 8px;
}

.wave {
  display: flex;
  align-items: center;
  background: var(--ui-element-bg);
  border-radius: 6px;
  padding: 0 8px;
}

.score img { 
  width: 20px;
  height: 20px;
  opacity: 0.9;
  filter: drop-shadow(0 0 2px var(--glow-primary));
}

.lives img { 
  width: 30px;
  height: 30px;
  opacity: 0.9;
  transition: opacity var(--transition-standard);
  filter: drop-shadow(0 0 2px var(--glow-primary));
}


/* Typography */
.header a, 
.time,
.wave { 
  font-family: var(--font-primary); 
  font-size: 12px;
  color: var(--color-text);
  text-shadow: var(--text-shadow);
}

.time {
  margin: 0 12px;
}

/* Bullet System */
#bullets-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: var(--z-background);
  pointer-events: none;
}

.bullet {
  position: absolute;
  z-index: var(--z-game);
  pointer-events: none;
  filter: drop-shadow(0 0 2px var(--glow-primary));
}

/* Animations */
@keyframes moveBackground { 
  from { background-position: 0 0; } 
  to { background-position: -640px 0; } 
}

@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: 0.7; }
  100% { opacity: 1; }
}

/* Performance Optimizations */
.enemy, 
#player, 
.bullet {
  transform: translateZ(0);
  backface-visibility: hidden;
}


/* Reduce paint operations by grouping transforms */
.enemy,
.bullet,
#player {
  transform-origin: center center;
  contain: layout style paint;
}

/* Optimize composite layers */
.header {
  contain: layout style;
  z-index: var(--z-header);
}

/* Add this to your existing CSS */
.explosion {
  position: absolute;
  pointer-events: none;
  width: 48px;
  height: 48px;
  transform-origin: center center;
  will-change: transform, opacity;
  z-index: 1;
}

.explosion::before,
.explosion::after {
  content: '';
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: rgba(255, 200, 0, 0.8);
  transform: scale(0);
  opacity: 1;
}

.explosion.active::before {
  animation: explode1 0.3s ease-out forwards;
}

.explosion.active::after {
  animation: explode2 0.3s ease-out forwards;
}

@keyframes explode1 {
  to {
    transform: scale(1.2);
    opacity: 0;
  }
}

@keyframes explode2 {
  to {
    transform: scale(0.8);
    opacity: 0;
  }
}

@keyframes scorePopup {
    0% {
        opacity: 1;
        transform: translateY(0);
    }
    100% {
        opacity: 0;
        transform: translateY(-20px);
    }
}

.score-popup {
    animation: scorePopup 0.5s ease-out forwards;
    text-shadow: 0 0 4px rgba(255, 255, 255, 0.7);
    will-change: transform, opacity;
}

/* Add better breakpoints */
@media (max-width: 660px) {
  :root {
    --game-width: 100vw;
    --game-height: 100vh;
    --header-height: 28px; /* Slightly smaller for mobile */
    --font-size-normal: 10px; /* Smaller font for mobile */
  }
  
  .header {
    width: calc(100% - 16px);
    left: 8px;
    padding: 0 10px;
  }

  .score img {
    width: 16px;
    height: 16px;
  }

  .lives img {
    width: 24px;
    height: 24px;
  }
}

/* Add landscape mode optimization */
@media (max-height: 500px) and (orientation: landscape) {
  .header {
    top: 2px;
    height: 26px;
  }
}

  </style>
</head>
<body>
  <div id="noise-effect"></div>
  <div id="darkness-effect"></div>

  <div id="lobby">
    <div id="lobby-background"></div>
    <img id="lobby-logo" src="assets/Title.png" alt="Game Logo">
    <div id="lobby-text">Press SPACE to Start</div>
    <img id="lobby-image" src="assets/HowToPlay.png" alt="How to Play">
  </div>

  <div id="game">
    <div id="background"></div>
    <div id="enemies-container"></div>
    <div class="header">
      <div class="score">
        <img src="assets/coin.png" alt="Coin">
        <a>SCORE: 0</a>
      </div>
      <div class="time">00:00</div>
      <div class="wave">
        <a>WAVE: 1</a>
    </div>
      <div class="lives">
        <a>LIVES : </a>
        <img class="life" src="assets/Heart.png" alt="Life">
        <img class="life" src="assets/Heart.png" alt="Life">
        <img class="life" src="assets/Heart.png" alt="Life">
      </div>
    </div>
    <div id="player"></div>
  </div>

  <script>

    // Add this class before the GameEngine class
class ExplosionManager {
  constructor(container, poolSize = 20) {
    this.container = container;
    this.pool = [];
    this.activeExplosions = new Set();
    
    // Create explosion pool
    for (let i = 0; i < poolSize; i++) {
      const explosion = document.createElement('div');
      explosion.className = 'explosion';
      this.pool.push(explosion);
    }
  }

  createExplosion(x, y) {
    // Get explosion from pool or create new if none available
    let explosion = this.pool.pop();
    if (!explosion) {
      explosion = document.createElement('div');
      explosion.className = 'explosion';
    }

    // Set position
    explosion.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    this.container.appendChild(explosion);
    this.activeExplosions.add(explosion);

    // Add active class in next frame for animation
    requestAnimationFrame(() => {
      explosion.classList.add('active');
    });

    // Return to pool after animation
    setTimeout(() => {
      explosion.classList.remove('active');
      this.container.removeChild(explosion);
      this.pool.push(explosion);
      this.activeExplosions.delete(explosion);
    }, 300); // Match animation duration
  }

  clear() {
    this.activeExplosions.forEach(explosion => {
      explosion.classList.remove('active');
      this.container.removeChild(explosion);
      this.pool.push(explosion);
    });
    this.activeExplosions.clear();
  }
}

class Enemy {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.width = 48;
    this.height = 48;
    this.type = type;
    this.element = this.createEnemyElement();
    this.direction = 1;
    this.lastShot = 0;
    this.shootCooldown = 2000 + Math.random() * 3000; // Random cooldown between 2-5 seconds
  }

  canShoot(currentTime) {
    return currentTime - this.lastShot >= this.shootCooldown;
  }

  createEnemyElement() {
    const enemy = document.createElement('div');
    enemy.className = 'enemy';
    enemy.style.cssText = `
      position: absolute;
      width: 48px;
      height: 48px;
      background-image: url('assets/enemy2.svg');
      background-size: contain;
      background-repeat: no-repeat;
      transform: translate3d(${this.x}px, ${this.y}px, 0);
      will-change: transform;
      filter: ${this.getColorFilter()};
      flex-shrink: 0;
    `;
    return enemy;
  }

  getColorFilter() {
    switch(this.type) {
      case 2:
        return 'hue-rotate(120deg)';
      case 3:
        return 'hue-rotate(240deg)';
      default:
        return 'none';
    }
  }

  updatePosition() {
    this.element.style.transform = `translate3d(${this.x}px, ${this.y}px, 0)`;
  }
}

class Bullet {
  constructor(x, y, isPlayerBullet = true) {
    this.x = x;
    this.y = y;
    this.width = 21;
    this.height = 22;
    this.speed = isPlayerBullet ? -0.5 : 0.3;
    this.isPlayerBullet = isPlayerBullet;
    this.element = this.createBulletElement();
  }

  createBulletElement() {
    const bullet = document.createElement('div');
    bullet.className = 'bullet';
    bullet.style.cssText = `
      position: absolute;
      width: ${this.width}px;
      height: ${this.height}px;
      background-image: url('${this.isPlayerBullet ? 'assets/Player_Bullet.png' : 'assets/enemy_bullet.png'}');
      background-size: contain;
      background-repeat: no-repeat;
      transform: translate3d(${this.x}px, ${this.y}px, 0);
      will-change: transform;
    `;
    return bullet;
  }

  update(delta) {
    this.y += this.speed * delta;
    this.updatePosition();
    return this.isInBounds();
  }

  updatePosition() {
    this.element.style.transform = `translate3d(${this.x}px, ${this.y}px, 0)`;
  }

  isInBounds() {
    return this.y > -this.height && this.y < 640;
  }

  checkCollision(target) {
    return this.x < target.x + target.width &&
           this.x + this.width > target.x &&
           this.y < target.y + target.height &&
           this.y + this.height > target.y;
  }
}

class EnemyGrid {
  constructor(movementMode = 'step') {
    this.enemies = [];
    this.container = document.getElementById('enemies-container');
    this.movementMode = movementMode;
    
    this.moveSpeed = 0.03;
    this.moveStep = 20;
    this.moveInterval = 2000;
    this.moveDuration = 1000;
    this.lastMoveTime = 0;
    this.isMoving = false;
    this.currentStepProgress = 0;

    this.continuousSpeed = 0.03;
    this.dropDistance = 30;
    this.direction = 1;
    // Make these configurable
    this.rows = 3;
        this.cols = 7;
        this.padding = 10;

        // Add formation tracking
        this.currentFormation = {
            rows: this.rows,
            cols: this.cols
        };

    this.lastEnemyShot = 0;
    this.enemyShootInterval = 1000; // Minimum time between any enemy shots
    this.initialize();
  }

  initialize() {
        while (this.container.firstChild) {
            this.container.removeChild(this.container.firstChild);
        }
        
        // Use current formation values
        const gridWidth = (48 + this.padding) * this.currentFormation.cols - this.padding;
        const startX = (640 - gridWidth) / 2;
        const startY = 60;

        // Clear existing enemies array
        this.enemies = [];

        for (let row = 0; row < this.currentFormation.rows; row++) {
            for (let col = 0; col < this.currentFormation.cols; col++) {
                const x = startX + col * (48 + this.padding);
                const y = startY + row * (48 + this.padding);
                const type = Math.min(row + 1, 3);
                
                const enemy = new Enemy(x, y, type);
                this.enemies.push(enemy);
                this.container.appendChild(enemy.element);
            }
        }
    }

  // Add method to change formation
  setFormation(rows, cols, padding = 10) {
        this.currentFormation = {
            rows: rows,
            cols: cols
        };
        this.padding = padding;
        this.initialize();
    }

  // Add this method to EnemyGrid class to properly reset speeds:
reset() {
    this.moveSpeed = 0.03;
    this.continuousSpeed = 0.05;
    this.direction = 1;
    this.lastMoveTime = 0;
    this.isMoving = false;
    this.currentStepProgress = 0;
}

  tryEnemyShoot(currentTime) {
    if (currentTime - this.lastEnemyShot < this.enemyShootInterval || this.enemies.length === 0) {
      return;
    }

    // Get bottom-most enemies (they're the only ones that can shoot)
    const bottomEnemies = this.getBottomEnemies();
    if (bottomEnemies.length === 0) return;

    // Randomly select one bottom enemy to shoot
    const randomEnemy = bottomEnemies[Math.floor(Math.random() * bottomEnemies.length)];
    
    if (randomEnemy.canShoot(currentTime)) {
      randomEnemy.lastShot = currentTime;
      this.lastEnemyShot = currentTime;
      
      // Create bullet at enemy position
      if (window.game) {
        const bulletX = randomEnemy.x + (randomEnemy.width / 2) - 10.5;
        const bulletY = randomEnemy.y + randomEnemy.height;
        game.createEnemyBullet(bulletX, bulletY);
      }
    }
  }

  getBottomEnemies() {
    const bottomEnemies = [];
    const enemiesByColumn = {};

    // Group enemies by their x position (column)
    this.enemies.forEach(enemy => {
      const column = Math.floor(enemy.x);
      if (!enemiesByColumn[column] || enemiesByColumn[column].y < enemy.y) {
        enemiesByColumn[column] = enemy;
      }
    });

    // Get only the bottom enemies
    return Object.values(enemiesByColumn);
  }

  setMovementMode(mode) {
    this.movementMode = mode;
    this.isMoving = false;
    this.currentStepProgress = 0;
    this.lastMoveTime = 0;
  }

  update(delta, currentTime) {
    if (this.enemies.length === 0) return;

    if (this.movementMode === 'step') {
      this.updateStepMovement(delta, currentTime);
    } else {
      this.updateContinuousMovement(delta);
    }

    // Add this line to enable enemy shooting
    this.tryEnemyShoot(currentTime);
  }

  updateStepMovement(delta, currentTime) {
    if (!this.isMoving && (currentTime - this.lastMoveTime >= this.moveInterval)) {
      this.isMoving = true;
      this.currentStepProgress = 0;
      this.lastMoveTime = currentTime;

      if (this.shouldChangeDirection()) {
        this.changeDirection();
      }
    }

    if (this.isMoving) {
      const moveAmount = (this.moveSpeed * delta) * this.direction;
      this.currentStepProgress += Math.abs(moveAmount);

      this.enemies.forEach(enemy => {
        enemy.x += moveAmount;
        enemy.updatePosition();
      });

      if (this.currentStepProgress >= this.moveStep) {
        this.isMoving = false;
        
        const excess = this.currentStepProgress - this.moveStep;
        const adjustment = excess * this.direction;
        
        this.enemies.forEach(enemy => {
          enemy.x -= adjustment;
          enemy.updatePosition();
        });
      }
    }
  }

  updateContinuousMovement(delta) {
    if (this.shouldChangeDirection()) {
      this.changeDirection();
    }

    const moveAmount = this.continuousSpeed * delta * this.direction;
    this.enemies.forEach(enemy => {
      enemy.x += moveAmount;
      enemy.updatePosition();
    });
  }

  shouldChangeDirection() {
    let leftmost = Infinity;
    let rightmost = -Infinity;
    
    this.enemies.forEach(enemy => {
      leftmost = Math.min(leftmost, enemy.x);
      rightmost = Math.max(rightmost, enemy.x + enemy.width);
    });

    return (rightmost + this.moveStep >= 640 && this.direction > 0) || 
           (leftmost - this.moveStep <= 0 && this.direction < 0);
  }

  changeDirection() {
    this.direction *= -1;
    this.enemies.forEach(enemy => {
      enemy.y += this.dropDistance;
      if (enemy.y + enemy.height >= 570) {
        this.triggerGameOver();
      }
    });
  }

  setStepParameters(speed, step, interval, duration) {
    this.moveSpeed = speed;
    this.moveStep = step;
    this.moveInterval = interval;
    this.moveDuration = duration;
  }

  setContinuousSpeed(speed) {
    this.continuousSpeed = speed;
  }

  triggerGameOver() {
    if (window.game) {
      game.gameOver();
    }
  }

  removeEnemy(enemy) {
    const index = this.enemies.indexOf(enemy);
    if (index > -1) {
      this.enemies.splice(index, 1);
      this.container.removeChild(enemy.element);
    }
  }
}

class GameEngine {
  constructor() {
    this.lobby = document.getElementById('lobby');
    this.gameContainer = document.getElementById('game');
    this.playerElement = document.getElementById('player');
    this.scoreElement = document.querySelector('.score a');
    this.timeElement = document.querySelector('.time');
    this.livesElements = document.querySelectorAll('.life');

    this.explosionManager = new ExplosionManager(this.gameContainer);


    this.enemyGrid = null;
    this.keyStates = {
      ArrowLeft: false,
      ArrowRight: false,
      Space: false
    };
    
    this.gameState = 'lobby'; // Can be 'lobby', 'playing', 'paused', 'gameOver'
    this.gameTime = 0;
    this.score = 0;
    this.lives = 3;
    this.currentLevel = 1;
    this.playerX = (this.GAME_WIDTH - this.PLAYER_WIDTH) / 2;
    this.playerY = 570;
    this.isRunning = false;
    this.isPaused = false;
    this.lastUIUpdate = 0;

    // Bullet management
    this.bullets = [];
    this.enemyBullets = [];
    this.lastPlayerShot = 0;
    this.playerShootCooldown = 350;
    this.bulletsContainer = document.createElement('div');
    this.bulletsContainer.id = 'bullets-container';
    this.gameContainer.appendChild(this.bulletsContainer);

    this.TIMESTEP = 1000 / 60;
    this.MAX_FRAMETIME = 250;
    this.lastTick = performance.now();
    this.accumulator = 0;
    this.rafHandle = null;

    this.PLAYER_SPEED = 0.3;
    this.GAME_WIDTH = 640;
    this.PLAYER_WIDTH = 48;  // Increased from 32
    this.PLAYER_HEIGHT = 48; // Increased from 32

    this.currentWave = 1;
    this.enemiesPerWave = 21; // 3 rows × 7 columns = 21 enemies
    this.enemiesDefeated = 0;
    this.isWaveTransitioning = false;

    // Add animation properties
    this.spriteFrame = 0;
        this.frameTime = 0;
        this.frameDuration = 100; // Update every 100ms
    
    this.init();
  }

  init() {
    this.setupEventListeners();
    this.optimizePerformance();
    this.resetPlayerPosition();
  }

  setupEventListeners() {
    document.addEventListener('keydown', (e) => {
      if (this.keyStates.hasOwnProperty(e.code)) {
        e.preventDefault();
        this.keyStates[e.code] = true;
        
        // Special handling for Space key
        if (e.code === 'Space') {
          this.handleSpacePress();
        }
      }
      
      if (e.code === 'Escape') {
        this.togglePause();
      }
      if (e.code === 'KeyL' && this.gameState === 'playing') {
    if (this.currentLevel < 10) {
        this.currentLevel++;
        this.setupLevel(this.currentLevel);
    }
}
    });

    document.addEventListener('keyup', (e) => {
      if (this.keyStates.hasOwnProperty(e.code)) {
        e.preventDefault();
        this.keyStates[e.code] = false;
      }
    });
  }

  createEnemyBullet(x, y) {
    const bullet = new Bullet(x, y, false); // false indicates enemy bullet
    this.bullets.push(bullet);
    this.bulletsContainer.appendChild(bullet.element);
  }
  
  handleSpacePress() {
    switch(this.gameState) {
      case 'lobby':
        this.keyStates.Space = false; // Reset space key state before starting game
        this.startGame();
        break;
      case 'gameOver':
        this.resetGame();
        break;
      case 'playing':
        // Do nothing here - shooting is handled in update loop
        break;
    }
  }

  resetKeyStates() {
    Object.keys(this.keyStates).forEach(key => {
      this.keyStates[key] = false;
    });
  }

  optimizePerformance() {
    this.playerElement.style.transform = 'translateZ(0)';
    this.playerElement.style.willChange = 'transform';
    this.gameContainer.style.willChange = 'contents';
  }

  startGame() {
    this.lobby.style.display = 'none';
    this.gameContainer.style.display = 'block';
    this.isRunning = true;
    this.gameState = 'playing';
    this.lastTick = performance.now();
    this.gameTime = 0;
    this.score = 0;
    this.lives = 3;
    this.currentLevel = 1;
    this.currentWave = 1;
    this.enemiesDefeated = 0;
    this.enemyGrid = new EnemyGrid('step');
    this.enemyGrid.reset(); // Reset the enemy grid properties
    this.setupLevel(this.currentLevel);
    this.resetKeyStates();
    
    
    this.runGameLoop();
  }


  setupLevel(level) {
    const baseSpeed = 0.03;
    const baseStepDistance = 20;  // Add this
    const baseInterval = 2000;
    const baseDuration = 1000;    // Add this
    // Define formations for each level
    const levelFormations = {
        1: { rows: 2, cols: 5 },    // 10 enemies - Easy start
        2: { rows: 2, cols: 7 },    // 14 enemies
        3: { rows: 3, cols: 6 },    // 18 enemies
        4: { rows: 3, cols: 7 },    // 21 enemies
        5: { rows: 4, cols: 6 },    // 24 enemies
        6: { rows: 4, cols: 7 },    // 28 enemies
        7: { rows: 5, cols: 6 },    // 30 enemies
        8: { rows: 5, cols: 7 },    // 35 enemies
        9: { rows: 6, cols: 7 },    // 42 enemies
        10: { rows: 7, cols: 8 }    // 56 enemies - Final challenge
    };

    // Get formation for current level
    const formation = levelFormations[level] || levelFormations[1];

    // Update enemy grid formation
    this.enemyGrid.setFormation(formation.rows, formation.cols);

    // Update enemiesPerWave based on new formation
    this.enemiesPerWave = formation.rows * formation.cols;

    switch(level) {
        case 1: // Beginner level
            this.enemyGrid.setMovementMode('step');
            this.enemyGrid.setStepParameters(baseSpeed, baseStepDistance, baseInterval, baseDuration);
            break;
            
        case 2:
            this.enemyGrid.setMovementMode('step');
            this.enemyGrid.setStepParameters(baseSpeed * 1.4, baseStepDistance, 
                baseInterval - 300, baseDuration - 100);
            break;
            
        case 3:
            this.enemyGrid.setMovementMode('continuous');
            this.enemyGrid.setContinuousSpeed(baseSpeed * 1.5);
            break;
            
        case 4:
            this.enemyGrid.setMovementMode('continuous');
            this.enemyGrid.setContinuousSpeed(baseSpeed * 1.7);
            break;
            
        case 5:
            this.enemyGrid.setMovementMode('step');
            this.enemyGrid.setStepParameters(baseSpeed * 1.8, baseStepDistance + 10, 
                baseInterval - 600, baseDuration - 300);
            break;
            
        case 6:
            this.enemyGrid.setMovementMode('continuous');
            this.enemyGrid.setContinuousSpeed(baseSpeed * 2.0);
            break;
            
        case 7:
            this.enemyGrid.setMovementMode('step');
            this.enemyGrid.setStepParameters(baseSpeed * 2.2, baseStepDistance + 15, 
                baseInterval - 800, baseDuration - 400);
            break;
            
        case 8:
            this.enemyGrid.setMovementMode('continuous');
            this.enemyGrid.setContinuousSpeed(baseSpeed * 2.4);
            break;
            
        case 9:
            this.enemyGrid.setMovementMode('step');
            this.enemyGrid.setStepParameters(baseSpeed * 2.6, baseStepDistance + 20, 
                baseInterval - 1000, baseDuration - 500);
            break;
            
        case 10: // Final level - maximum challenge
            this.enemyGrid.setMovementMode('continuous');
            this.enemyGrid.setContinuousSpeed(baseSpeed * 3.0); // Much faster for final level
            break;
    }

    // Adjust enemy shooting based on formation size
    const totalEnemies = this.enemiesPerWave;
    this.enemyGrid.enemyShootInterval = Math.max(
        400, 
        2000 - (level * 150) - (totalEnemies * 5)
    );
    
    // Adjust drop distance based on formation height
    this.enemyGrid.dropDistance = Math.min(
        25 + (level * 2), 
        65 / formation.rows  // Smaller drops for taller formations
    );
}

  playerShoot() {
    const now = performance.now();
    if (now - this.lastPlayerShot >= this.playerShootCooldown) {
      const bulletX = this.playerX + (this.PLAYER_WIDTH / 2) - 10.5;
      const bulletY = this.playerY - 22;
      
      const bullet = new Bullet(bulletX, bulletY, true);
      this.bullets.push(bullet);
      this.bulletsContainer.appendChild(bullet.element);
      
      this.lastPlayerShot = now;
    }
  }

  updateBullets(delta) {
  for (let i = this.bullets.length - 1; i >= 0; i--) {
    const bullet = this.bullets[i];
    const isActive = bullet.update(delta);

    if (!isActive) {
      this.bulletsContainer.removeChild(bullet.element);
      this.bullets.splice(i, 1);
      continue;
    }

    // Handle player bullets hitting enemies
    if (bullet.isPlayerBullet && this.enemyGrid) {
      for (let j = this.enemyGrid.enemies.length - 1; j >= 0; j--) {
        const enemy = this.enemyGrid.enemies[j];
        if (bullet.checkCollision(enemy)) {
          // Create explosion at enemy position
          this.explosionManager.createExplosion(enemy.x, enemy.y);

          // Calculate score and update overall score
          const scorePoints = this.calculateScore(enemy.type);
          this.score += scorePoints;

          // Remove enemy from grid
          this.enemyGrid.removeEnemy(enemy);

          // Remove bullet from the screen and from the array
          this.bulletsContainer.removeChild(bullet.element);
          this.bullets.splice(i, 1);

          // Optional: Show score popup for visual feedback
          const scoreText = document.createElement('div');
          scoreText.className = 'score-popup';
          scoreText.textContent = `+${scorePoints}`;
          scoreText.style.cssText = `
            position: absolute;
            left: ${enemy.x + 24}px;
            top: ${enemy.y}px;
            color: white;
            font-family: var(--font-primary);
            font-size: 12px;
            pointer-events: none;
            z-index: 1000;
            opacity: 1;
            transform: translateY(0);
            transition: all 0.5s ease-out;
          `;
          this.gameContainer.appendChild(scoreText);

          // Animate and remove score notification
          requestAnimationFrame(() => {
            scoreText.style.opacity = '0';
            scoreText.style.transform = 'translateY(-20px)';
          });
          setTimeout(() => {
            if (scoreText.parentNode) {
              this.gameContainer.removeChild(scoreText);
            }
          }, 500);

          // Check if all enemies have been defeated
          if (this.enemyGrid.enemies.length === 0) {
            setTimeout(() => this.startNewWave(), 0);
          }

          break; // Exit the enemy loop once a collision is processed
        }
      }
    } else {
      // Handle enemy bullets hitting the player
      if (this.checkBulletPlayerCollision(bullet)) {
        // Create explosion effect for player hit
        this.explosionManager.createExplosion(
          this.playerX + (this.PLAYER_WIDTH / 2) - 24,
          this.playerY + (this.PLAYER_HEIGHT / 2) - 24
        );

        this.handlePlayerHit();
        this.bulletsContainer.removeChild(bullet.element);
        this.bullets.splice(i, 1);

        // Add hit flash effect to player
        this.playerElement.style.filter = 'brightness(2)';
        setTimeout(() => {
          this.playerElement.style.filter = 'none';
        }, 100);
      }
    }
  }
}


calculateScore(enemyType) {
    // Simply return the score based on enemy type
    switch(enemyType) {
        case 3: return 30;
        case 2: return 20;
        default: return 10;
    }
}


startNewWave() {
    if (this.isWaveTransitioning) return;
    this.isWaveTransitioning = true;

    requestAnimationFrame(() => {
        this.currentWave++;
        this.enemiesDefeated = 0;

        if (this.currentWave % 2 === 0) {
            this.currentLevel++;
            
            if (this.currentLevel > 10) {
                this.victoryScreen();
                return;
            }
            
            this.setupLevel(this.currentLevel);
        } else {
            // For odd-numbered waves, just reinitialize with same formation
            this.enemyGrid.initialize();
        }

        // Clear bullets
        while (this.bulletsContainer.firstChild) {
            this.bulletsContainer.removeChild(this.bulletsContainer.firstChild);
        }
        this.bullets = [];

        this.isWaveTransitioning = false;
    });
}

victoryScreen() {
    this.isRunning = false;
    this.gameState = 'victory';
    cancelAnimationFrame(this.rafHandle);
    
    const finalScore = this.score;
    const timeElapsed = this.timeElement.textContent;
    
    alert(`Congratulations! You've completed all 10 levels!\nFinal Score: ${finalScore}\nTime: ${timeElapsed}`);
    
    // Reset the game
    this.resetGame();
}


  runGameLoop() {
    if (!this.isRunning) return;

    const now = performance.now();
    let delta = now - this.lastTick;
    this.lastTick = now;

    if (delta > this.MAX_FRAMETIME) {
      delta = this.MAX_FRAMETIME;
    }

    this.accumulator += delta;

    while (this.accumulator >= this.TIMESTEP) {
      this.update(this.TIMESTEP, now);
      this.accumulator -= this.TIMESTEP;
    }

    this.render(this.accumulator / this.TIMESTEP);
    this.rafHandle = requestAnimationFrame(this.runGameLoop.bind(this));
  }

  update(delta, currentTime) {
    if (this.isPaused) return;

        // Update sprite animation
        this.frameTime += delta;
        if (this.frameTime >= this.frameDuration) {
            this.spriteFrame = (this.spriteFrame + 1) % 2;
            this.frameTime = 0;
            this.playerElement.style.backgroundPosition = 
                `${this.spriteFrame * -48}px 0`; // -48px because frame width is 48px
        }

        // Regular movement
        const movement = this.PLAYER_SPEED * delta;
        if (this.keyStates.ArrowLeft) {
            this.playerX = Math.max(0, this.playerX - movement);
        }
        if (this.keyStates.ArrowRight) {
            this.playerX = Math.min(this.GAME_WIDTH - this.PLAYER_WIDTH, this.playerX + movement);
        }
    
    // Only allow shooting when actually playing
    if (this.keyStates.Space && this.gameState === 'playing') {
      this.playerShoot();
    }

    if (this.enemyGrid) {
      this.enemyGrid.update(delta, currentTime);
    }

    this.updateBullets(delta);
    this.gameTime += delta;
    this.updateTimeDisplay();
  }

  checkBulletPlayerCollision(bullet) {
    return bullet.x < this.playerX + this.PLAYER_WIDTH &&
           bullet.x + bullet.width > this.playerX &&
           bullet.y < this.playerY + 45 && // Player height is 45px
           bullet.y + bullet.height > this.playerY;
  }

  handlePlayerHit() {
    this.lives--;
    if (this.lives <= 0) {
      this.gameOver();
    } else {
      this.resetPlayerPosition();
    }
  }

  updateTimeDisplay() {
    const minutes = Math.floor(this.gameTime / 60000);
    const seconds = Math.floor((this.gameTime % 60000) / 1000);
    this.timeElement.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }

  render(alpha) {
    const renderX = this.playerX + (this.PLAYER_SPEED * alpha * this.TIMESTEP);
    this.playerElement.style.transform = `translate3d(${renderX}px, ${this.playerY}px, 0)`;
    this.updateUI();
  }

  updateUI() {
    const now = performance.now();
    if (now - this.lastUIUpdate < 16) return;

    this.scoreElement.textContent = `SCORE: ${this.score}`;
    document.querySelector('.wave a').textContent = `WAVE: ${this.currentWave}`;
    this.livesElements.forEach((life, index) => {
        life.style.opacity = index < this.lives ? 1 : 0.3;
    });

    this.lastUIUpdate = now;
}

togglePause() {
        if (this.gameState !== 'playing' && this.gameState !== 'paused') return;
        
        this.isPaused = !this.isPaused;
        this.gameState = this.isPaused ? 'paused' : 'playing';
        
        // Reset frame timing on unpause
        if (!this.isPaused) {
            this.lastTick = performance.now();
            this.accumulator = 0;
            this.frameTime = 0;
        }
    }

  resetPlayerPosition() {
    this.playerX = 300;
    this.playerY = 570;
    this.playerElement.style.transform = `translate3d(${this.playerX}px, ${this.playerY}px, 0)`;
  }

  gameOver() {
    this.isRunning = false;
    this.gameState = 'gameOver';
    cancelAnimationFrame(this.rafHandle);
    alert('Game Over! The aliens have landed!');
    this.resetGame();
  }

  resetGame() {
    this.score = 0;
    this.lives = 3;
    this.gameTime = 0;
    this.currentLevel = 1;
    this.resetPlayerPosition();
    this.updateUI();
    this.lobby.style.display = 'flex';
    this.gameContainer.style.display = 'none';
    this.isRunning = false;
    this.gameState = 'lobby';
    this.currentWave = 1;
    this.enemiesDefeated = 0;
    this.explosionManager.clear();

    // Reset key states when resetting the game
    this.resetKeyStates();

    // Clear all bullets
    while (this.bulletsContainer.firstChild) {
      this.bulletsContainer.removeChild(this.bulletsContainer.firstChild);
    }
    this.bullets = [];
  }
}

// Initialize game instance
const game = new GameEngine();
  </script>
