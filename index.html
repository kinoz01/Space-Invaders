<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Space Invaders Game - A classic arcade shooter">

  <!-- Browser UI elements' -->
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="assets/favicon.svg" type="image/x-icon">
  
  <!-- Preconnect for Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/style.css">
  <title>Space Invaders</title>
</head>
<body>
  <div id="noise-effect"></div>
  <div id="darkness-effect"></div>

  <div id="lobby">
    <div id="lobby-background"></div>
    <img id="lobby-logo" src="assets/Title.png" alt="Game Logo">
    <div id="lobby-text">Press SPACE to Start</div>
    <img id="lobby-image" src="assets/HowToPlay.png" alt="How to Play">
  </div>

  <div id="game">
    <div id="background"></div>
    <div id="enemies-container"></div>
    <div class="header">
      <div class="score">
        <img src="assets/coin.png" alt="Coin">
        <a>SCORE: 0</a>
      </div>
      <div class="time">00:00</div>
      <div class="wave">
        <a>WAVE: 1</a>
    </div>
      <div class="lives">
        <a>LIVES : </a>
        <img class="life" src="assets/Heart.png" alt="Life">
        <img class="life" src="assets/Heart.png" alt="Life">
        <img class="life" src="assets/Heart.png" alt="Life">
      </div>
    </div>
    <div id="player"></div>
  </div>

  <!-- Pause Modal -->
  <div id="pause-modal" class="pause-modal hidden">
    <div class="pause-content">
      <h2>Paused</h2>
      <p>Press R to Restart<br>Press P to Continue</p>
    </div>
  </div>

  <!-- Victory and game-over screens -->
  <div class="game-screen victory-screen hidden">
    <div class="screen-content">
      <img src="assets/Victory.png" alt="Victory!" class="result-image">
      <h2>Congratulations!</h2>
      <br><div class="stats">
        <p>Final Score: <span class="final-score">0</span></p>
        <p>Time: <span class="final-time">0:00</span></p>
      </div>
      <button class="restart-btn">Play Again</button>
    </div>
  </div>
  <div class="game-screen game-over-screen hidden">
    <div class="screen-content">
      <img src="assets/Lose.png" alt="You Lose!" class="result-image">
      <h2>Game Over!</h2></br>
      <p>The aliens have landed!</p>
      <div class="stats">
        <p>Score: <span class="final-score">0</span></p>
      </div>
      <button class="restart-btn">Try Again</button>
    </div>
  </div>

  <script src="/scripts/explosion.js"></script>
  <script src="/scripts/enemy.js"></script>
  <script src="/scripts/bullet.js"></script>
  <script src="/scripts/enemyGrid.js"></script>
  <script src="/scripts/screens.js"></script>
  <script src="/scripts/gameEngine.js"></script>
  <script>
    // Initialize game instance
    const game = new GameEngine();
  </script>
</body>
</html>
