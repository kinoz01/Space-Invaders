<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Space Invaders Game - A classic arcade shooter">

  <!-- Change browser UI elements' color -->
  <meta name="theme-color" content="#111111">
  
  <!-- Preconnect for Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/style.css">
  <title>Space Invaders</title>
</head>
<body>
  <div id="noise-effect"></div>
  <div id="darkness-effect"></div>

  <div id="lobby">
    <div id="lobby-background"></div>
    <img id="lobby-logo" src="assets/Title.png" alt="Game Logo">
    <div id="lobby-text">Press SPACE to Start</div>
    <img id="lobby-image" src="assets/HowToPlay.png" alt="How to Play">
  </div>

  <div id="game">
    <div id="background"></div>
    <div id="enemies-container"></div>
    <div class="header">
      <div class="score">
        <img src="assets/coin.png" alt="Coin">
        <a>SCORE: 0</a>
      </div>
      <div class="time">00:00</div>
      <div class="wave">
        <a>WAVE: 1</a>
    </div>
      <div class="lives">
        <a>LIVES : </a>
        <img class="life" src="assets/Heart.png" alt="Life">
        <img class="life" src="assets/Heart.png" alt="Life">
        <img class="life" src="assets/Heart.png" alt="Life">
      </div>
    </div>
    <div id="player"></div>
  </div>

  <script src="/scripts/explosion.js"></script>
  <script src="/scripts/enemy.js"></script>
  <script src="/scripts/bullet.js"></script>
  <script src="/scripts/enemyGrid.js"></script>
  <script src="/scripts/gameEngine.js"></script>
  <script>
    // Initialize game instance
    const game = new GameEngine();
  </script>
</body>
</html>
